name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # This repo is public and VitifyCode-CI is private — public repos cannot
      # call private reusable workflows, so fetch the composite action instead.
      - uses: actions/checkout@v4
        with:
          repository: VitifyCode/VitifyCode-CI
          token: ${{ secrets.CI_TOKEN }}
          path: .vitifycode-ci
      - uses: ./.vitifycode-ci
        with:
          baseline-name: 'MyGtMcp'
          test-suite-name: 'MyGtMcp Tests'
