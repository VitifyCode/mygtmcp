name: Auto-merge PRs

# Inline copy of VitifyCode-CI's auto-merge.yml — this repo is public and
# cannot call the private shared workflow. check_suite never fires for suites
# created by GitHub Actions, hence the workflow_run trigger.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # head_repository check: only merge PRs from branches in this repo — a
    # stranger's fork PR with green CI must not merge itself.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Merge open PRs with passing checks
        env:
          # A merge pushed with the default GITHUB_TOKEN does not trigger other
          # workflows (recursion prevention) — notably notify-infra, so the PAS
          # runtime image would not redeploy. Set an AUTOMERGE_TOKEN secret
          # (PAT with repo scope) so the post-merge push fires them.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"

          # Find open PRs matching the SHA the CI workflow ran against
          prs=$(gh pr list --repo "${{ github.repository }}" --state open --json number,headRefOid --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number")

          for pr in $prs; do
            echo "Attempting to merge PR #$pr"
            gh pr merge "$pr" --repo "${{ github.repository }}" --squash --delete-branch || echo "Could not merge PR #$pr"
          done
