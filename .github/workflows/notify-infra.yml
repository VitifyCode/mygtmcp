name: Notify infra

# Tell VitifyCodePolicyEngineInfrastructure this package changed: its Deploy
# workflow (repository_dispatch: package-updated) re-stages sources, rebuilds
# the PAS runtime image, and rolls + prewarms the fleet. CI_TOKEN needs
# Contents: write on the infra repo.
on:
  push:
    branches: [master]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send package-updated dispatch
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          gh api repos/VitifyCode/VitifyCodePolicyEngineInfrastructure/dispatches \
            -f event_type=package-updated \
            -f 'client_payload[repo]=${{ github.repository }}' \
            -f 'client_payload[sha]=${{ github.sha }}'
